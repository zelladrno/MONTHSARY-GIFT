<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Someone Special ❤️</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600&display=swap');

    :root {
      --primary: #ff6b6b;
      --secondary: #ffb8b8;
      --light: #ffecec;
      --dark: #4a4a4a;
      --accent: #ff9e9e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--light);
      color: var(--dark);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 30px 0;
      position: relative;
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 3.5rem;
      color: var(--primary);
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 1.2rem;
      color: var(--dark);
      opacity: 0.8;
    }

    .heart-container {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 30px auto;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .heart {
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: var(--primary);
      transform: rotate(45deg);
      animation: pulse 1.5s infinite;
    }

    .heart:before,
    .heart:after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: var(--primary);
      border-radius: 50%;
    }

    .heart:before {
      top: -50%;
      left: 0;
    }

    .heart:after {
      top: 0;
      left: -50%;
    }

    @keyframes pulse {
      0% { transform: rotate(45deg) scale(1); }
      50% { transform: rotate(45deg) scale(1.1); }
      100% { transform: rotate(45deg) scale(1); }
    }

    section {
      margin: 40px 0;
      padding: 20px;
      background-color: white;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
    }

    h2 {
      font-family: 'Dancing Script', cursive;
      color: var(--primary);
      margin-bottom: 20px;
      font-size: 2rem;
    }

    .memory {
      display: flex;
      margin-bottom: 20px;
      position: relative;
      padding-left: 30px;
    }

    .memory:before {
      content: '';
      position: absolute;
      left: 10px;
      top: 0;
      height: 100%;
      width: 2px;
      background-color: var(--accent);
    }

    .memory-dot {
      position: absolute;
      left: 0;
      top: 5px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background-color: var(--primary);
      z-index: 1;
    }

    .memory-content {
      flex: 1;
    }

    .memory-date {
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 5px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .photo {
      width: 100%;
      height: 150px;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      transition: transform 0.3s;
    }

    .photo:hover {
      transform: scale(1.05);
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s;
    }

    .photo:hover img {
      transform: scale(1.1);
    }

    .letter {
      padding: 20px;
      background-color: var(--secondary);
      border-radius: 15px;
      position: relative;
    }

    .letter:before {
      content: '';
      position: absolute;
      top: 10px;
      right: 15px;
      width: 50px;
      height: 50px;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ff6b6b"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>');
      opacity: 0.2;
    }

    .letter-content {
      font-family: 'Dancing Script', cursive;
      font-size: 1.3rem;
      line-height: 1.8;
      color: var(--dark);
    }

    .message-input {
      width: 100%;
      padding: 15px;
      margin-bottom: 15px;
      border: none;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      background-color: rgba(255, 255, 255, 0.7);
    }

    .submit-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 30px;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
    }

    .submit-btn:hover {
      background-color: #ff5252;
      transform: translateY(-2px);
    }

    .hidden-message {
      display: none;
      padding: 20px;
      margin-top: 20px;
      background-color: var(--light);
      border-radius: 10px;
      text-align: center;
      animation: fadeIn 0.5s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    footer {
      text-align: center;
      margin-top: 40px;
      padding: 20px;
      color: var(--dark);
      opacity: 0.7;
      font-size: 0.9rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      h1 {
        font-size: 2.5rem;
      }

      .gallery {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Happy Monthsary Boss</h1>
      <p class="subtitle">Iloveee youuu</p>
      
      <div class="heart-container" id="heart">
        <div class="heart"></div>
      </div>
    </header>

   

      <div class="gallery">
        <div class="photo">
          <img src="images/pic1.jpg"/>
        </div>
        <div class="photo">
          <img src="images/pic2.jpg" />
        </div>
        <div class="photo">
          <img src="images/pic3.jpg" />
        </div>
        <div class="photo">
          <img src="images/pic4.jpeg" />
        </div>
      </div>
    
    <footer>
      Made With Love, By Jahzell Adriano
    </footer>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Heart animation on click
      const heart = document.getElementById('heart');
      heart.addEventListener('click', function() {
        this.style.transform = 'scale(1.2)';
        setTimeout(() => {
          this.style.transform = 'scale(1)';
        }, 300);
        
        // Create floating hearts
        for (let i = 0; i < 5; i++) {
          createFloatingHeart();
        }
      });

      // Message submission
      const submitBtn = document.getElementById('submitBtn');
      const messageInput = document.getElementById('messageInput');
      const hiddenMessage = document.getElementById('hiddenMessage');

      submitBtn.addEventListener('click', function() {
        if (messageInput.value.trim() !== '') {
          hiddenMessage.innerHTML = `<p>${messageInput.value}</p>`;
          hiddenMessage.style.display = 'block';
          messageInput.value = '';
        }
      });

      // Memory animation on scroll
      const memories = document.querySelectorAll('.memory');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.style.opacity = '1';
            entry.target.style.transform = 'translateX(0)';
          }
        });
      }, {
        threshold: 0.1
      });

      memories.forEach(memory => {
        memory.style.opacity = '0';
        memory.style.transform = 'translateX(-20px)';
        memory.style.transition = 'all 0.5s ease-out';
        observer.observe(memory);
      });

      // Photo hover effect
      const photos = document.querySelectorAll('.photo');
      photos.forEach(photo => {
        photo.addEventListener('mouseenter', function() {
          const img = this.querySelector('img');
          img.style.transform = 'scale(1.1)';
        });
        photo.addEventListener('mouseleave', function() {
          const img = this.querySelector('img');
          img.style.transform = 'scale(1)';
        });
      });
    });

    function createFloatingHeart() {
      const heart = document.createElement('div');
      heart.innerHTML = '❤️';
      heart.style.position = 'fixed';
      heart.style.fontSize = '20px';
      heart.style.color = '#ff6b6b';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.top = '100vh';
      heart.style.zIndex = '1000';
      heart.style.userSelect = 'none';
      heart.style.pointerEvents = 'none';
      heart.style.animation = `float ${Math.random() * 3 + 2}s linear forwards`;
      
      document.body.appendChild(heart);
      
      setTimeout(() => {
        heart.remove();
      }, 5000);
    }

    // Add style for floating animation
    document.head.insertAdjacentHTML('beforeend', `
      <style>
        @keyframes float {
          to {
            transform: translateY(calc(-100vh - 50px)) rotate(360deg);
            opacity: 0;
          }
        }
      </style>
    `);
  </script>
</body>
</html>
